{% macro confirmar_acao(rota, mensagem, id, titulo='Excluir compromisso?', rotulo='Excluir compromisso') %}
    <button type="button"
            class="botao-excluir"
            data-abrir-dialog="{{ id }}"
            aria-haspopup="dialog">
        Excluir
    </button>

    <dialog class="confirma-acao-dialog"
            id="{{ id }}"
            aria-labelledby="{{ id }}-titulo"
            aria-describedby="{{ id }}-descricao">
        <h2 id="{{ id }}-titulo">{{ titulo }}</h2>
        <p id="{{ id }}-descricao">{{ mensagem }}</p>
        <form action="{{ rota }}" method="POST">
            <div class="confirma-acao-botoes">
                <button type="button" class="botao-cancelar" data-fechar-dialog>
                    Cancelar
                </button>
                <button class="botao-excluir" type="submit">{{ rotulo }}</button>
            </div>
        </form>
    </dialog>
{% endmacro %}
