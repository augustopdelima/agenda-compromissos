<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pessoas</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 720px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #1f2937;
        }
        .grupo-campo {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }
        input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input.invalido {
            border-color: #dc2626;
        }
        .texto-erro {
            color: #dc2626;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: block;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 2rem;
        }
        th, td {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid #e5e7eb;
        }
        th {
            background-color: #f9fafb;
        }
    </style>
</head>
<body>
    <h1>Pessoas</h1>

    <!-- Formulário de Cadastro -->
    <form action="{{ url_for('pessoas.criar') }}" method="POST" novalidate>
        <div class="grupo-campo">
            <label for="nome">Nome</label>
            <input
                type="text"
                id="nome"
                name="nome"
                value="{{ formulario.get('nome', '') if formulario else '' }}"
                class="{{ 'invalido' if erros and erros.get('nome') else '' }}"
            >
            {% if erros and erros.get('nome') %}
                <span class="texto-erro">{{ erros.get('nome') }}</span>
            {% endif %}
        </div>

        <div class="grupo-campo">
            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ formulario.get('email', '') if formulario else '' }}"
                class="{{ 'invalido' if erros and erros.get('email') else '' }}"
            >
            {% if erros and erros.get('email') %}
                <span class="texto-erro">{{ erros.get('email') }}</span>
            {% endif %}
        </div>

        <button type="submit">Cadastrar</button>
    </form>

    <!-- Lista de Pessoas Cadastradas -->
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>E-mail</th>
            </tr>
        </thead>
        <tbody>
            {% for pessoa in pessoas %}
                <tr>
                    <td>{{ pessoa.nome }}</td>
                    <td>{{ pessoa.email }}</td> 
                </tr>
            {% else %}
                <tr>
                    <td colspan="3">Nenhuma pessoa cadastrada ainda.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
